<!doctype html>

<head>

<title>Luisa &amp; Tobi – alles Liebe zur Hochzeit</title>

<meta name="robots" content="noindex">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%237A3E36'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='13' font-weight='700' fill='%23fff' text-anchor='middle'%3ELT%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --paper: #ECE8E1;   /* Hintergrund, Greige */
    --accent: #7A3E36;  /* Rostrot, Kopfzeile und Hervorhebungen */
    --ink: #2B2220;     /* Haupttext */
    --muted: #5F514B;   /* Nebentext */
    --line: #A89C94;    /* Linien und Rahmen */
    --on-accent: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    text-align: center;
    overflow-x: hidden;
  }
  /* Kopfzeile in Akzentfarbe wie auf den Boardingpässen, unten eine feine Linie */
  body::before, body::after {
    content: "";
    position: fixed;
    left: 0; right: 0;
  }
  body::before { top: 0; height: 8px; background: var(--accent); }
  body::after { bottom: 0; height: 1px; background: var(--line); }

  main { position: relative; z-index: 1; max-width: 34rem; width: 100%; }

  .eyebrow {
    margin: 0 0 1.25rem;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-size: clamp(2.6rem, 13vw, 4.5rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -.02em;
  }
  h1 .amp { color: var(--accent); font-weight: 400; }
  .rule {
    width: 3rem;
    height: 2px;
    margin: 1.5rem auto;
    background: var(--accent);
    border: 0;
  }
  .wish {
    margin: 0;
    font-size: clamp(1.15rem, 5vw, 1.5rem);
    line-height: 1.4;
    font-weight: 400;
  }
  .flight {
    margin: 2.5rem 0 0;
    padding-top: 1.25rem;
    border-top: 1px dashed var(--line);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    font-size: .72rem;
    letter-spacing: .08em;
    color: var(--muted);
    line-height: 1.6;
  }
  .flight span { white-space: nowrap; }
  @media (max-width: 26rem) {
    .flight span { display: block; }
    .flight .sep { display: none; }
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  #sky { z-index: 0; }

  /* Querformat auf kleinen Geräten: kompakter */
  @media (orientation: landscape) and (max-height: 480px) {
    .eyebrow { margin-bottom: .6rem; }
    h1 { font-size: clamp(2rem, 8vh + 1rem, 3.2rem); }
    .rule { margin: .9rem auto; }
    .flight { margin-top: 1.25rem; padding-top: .9rem; }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">03. Oktober 2026</p>
  <h1>Luisa <span class="amp">&amp;</span> Tobi</h1>
  <hr class="rule">
  <p class="wish">alles Liebe und Gute zur Hochzeit</p>
  <p class="flight" aria-label="Flug LT 0310 am 3. Oktober 2026 von Ketsch nach Australien, Neuseeland und Fidschi">
    <span>LT 0310 · 03 OKT 2026</span><span class="sep"> · </span><span>KET → AUS · NZL · FJI</span>
  </p>
</main>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("confetti");
  var ctx = canvas.getContext && canvas.getContext("2d");
  if (!ctx) return;

  var COLORS = ["#E63946", "#F3722C", "#F9C74F", "#90BE6D", "#43AA8B", "#277DA1", "#9B5DE5", "#F15BB5", "#7A3E36"];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = 0, H = 0, dpr = 1, pieces = [], running = false, last = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function makePiece(staticMode) {
    var size = rand(6, 11);
    return {
      x: rand(0, W),
      y: staticMode ? rand(0, H) : rand(-H * 0.7, -10),
      w: size,
      h: size * rand(0.4, 0.7),
      color: COLORS[(Math.random() * COLORS.length) | 0],
      rot: rand(0, Math.PI * 2),
      vr: rand(-4, 4),          // rad/s
      vy: rand(60, 140),        // px/s
      sway: rand(0.8, 2.2),     // Frequenz
      swayAmp: rand(15, 45),    // px/s
      phase: rand(0, Math.PI * 2),
      flip: rand(2, 6)          // Kippgeschwindigkeit
    };
  }

  function count() {
    // Menge an Fläche anpassen, gedeckelt für ältere Geräte
    return Math.max(60, Math.min(160, Math.round((W * H) / 5000)));
  }

  function draw(p, t) {
    var scaleY = Math.cos(p.phase + t * p.flip);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(1, scaleY < 0 ? -scaleY : scaleY || 0.05);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    var t = now / 1000;
    ctx.clearRect(0, 0, W, H);
    var alive = 0;
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      if (p.y > H + 20) continue;
      p.y += p.vy * dt;
      p.x += Math.sin(p.phase + t * p.sway) * p.swayAmp * dt;
      p.rot += p.vr * dt;
      draw(p, t);
      alive++;
    }
    if (alive) {
      requestAnimationFrame(frame);
    } else {
      running = false;
      ctx.clearRect(0, 0, W, H);
    }
  }

  function burst() {
    var n = count();
    for (var i = 0; i < n; i++) pieces.push(makePiece(false));
    // Bereits gelandete Stücke entfernen
    pieces = pieces.filter(function (p) { return p.y <= H + 20; });
    if (!running) {
      running = true;
      last = performance.now();
      requestAnimationFrame(frame);
    }
  }

  function drawStatic() {
    // Reduzierte Bewegung: wenige ruhende Konfetti, keine Animation
    ctx.clearRect(0, 0, W, H);
    pieces = [];
    var n = Math.round(count() / 3);
    for (var i = 0; i < n; i++) {
      var p = makePiece(true);
      // Mitte für den Text freihalten
      if (Math.abs(p.y - H / 2) < H * 0.22 && Math.abs(p.x - W / 2) < W * 0.4) continue;
      draw(p, 0);
    }
  }

  resize();
  if (reduce) {
    drawStatic();
    window.addEventListener("resize", function () { resize(); drawStatic(); });
  } else {
    window.addEventListener("resize", resize);
    burst();
    // Antippen lässt es noch einmal regnen
    document.addEventListener("click", burst);
  }
})();
/* Kleines Flugzeug im Hintergrund mit Kondensstreifen, die sich auflösen */
(function () {
  "use strict";
  var canvas = document.getElementById("sky");
  var ctx = canvas.getContext && canvas.getContext("2d");
  if (!ctx) return;

  var PLANE = "#A89C94", TRAIL = "168,156,148";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = 0, H = 0, dpr = 1;
  var SPEED = 70, TRAIL_LIFE = 4, SAMPLE = 0.05;
  var clock = 0, last = 0, wait = 1.2, dir = 1, flight = null, trails = [[], []], sampleAt = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function shape(points) {
    ctx.beginPath();
    ctx.moveTo(points[0], points[1]);
    for (var i = 2; i < points.length; i += 2) ctx.lineTo(points[i], points[i + 1]);
    ctx.closePath();
    ctx.fill();
  }

  // Draufsicht, Nase zeigt nach +x
  function drawPlane(x, y, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = PLANE;
    shape([11, 0, 8, -1.5, -8, -1.2, -10, 0, -8, 1.2, 8, 1.5]);
    shape([3, -1, -3, -10, -5, -10, -2, -1]);
    shape([3, 1, -3, 10, -5, 10, -2, 1]);
    shape([-6, -1, -9, -4.5, -10.5, -4.5, -9, -1]);
    shape([-6, 1, -9, 4.5, -10.5, 4.5, -9, 1]);
    ctx.restore();
  }

  // Flugbahn: gerade Strecke mit zwei Loopings (s = zurückgelegte Strecke in px)
  function newFlight() {
    var r = Math.max(24, Math.min(45, Math.min(W, H) * 0.08));
    var portrait = H > W;
    flight = {
      s: 0,
      r: r,
      base: 14 + 2 * r + Math.random() * H * (portrait ? 0.12 : 0.06),
      start: dir > 0 ? -30 : W + 30,
      loops: [30 + W * (portrait ? 0.22 : 0.18), 30 + W * (portrait ? 0.68 : 0.78)],
      length: W + 60 + 2 * 2 * Math.PI * r
    };
  }

  // Position in Flugrichtung (lx nach vorn, ly Höhe) für Strecke s
  function local(f, s) {
    var C = 2 * Math.PI * f.r, off = 0;
    for (var i = 0; i < f.loops.length; i++) {
      var a = f.loops[i];
      if (s - off < a) break;
      if (s - off < a + C) {
        var phi = (s - off - a) / f.r;
        return [a + f.r * Math.sin(phi), f.base - f.r * (1 - Math.cos(phi))];
      }
      off += C;
    }
    return [s - off, f.base];
  }

  function world(f, s) {
    var p = local(f, s);
    return [dir > 0 ? f.start + p[0] : f.start - p[0], p[1]];
  }

  function heading(f, s) {
    var p = world(f, s), q = world(f, s + 0.5);
    return Math.atan2(q[1] - p[1], q[0] - p[0]);
  }

  function addTrail(x, y, angle, t) {
    var c = Math.cos(angle), s = Math.sin(angle);
    // Triebwerke an den Flügeln
    trails[0].push({ x: x - 3 * c + 5 * s, y: y - 3 * s - 5 * c, t: t });
    trails[1].push({ x: x - 3 * c - 5 * s, y: y - 3 * s + 5 * c, t: t });
  }

  function drawTrails() {
    for (var k = 0; k < 2; k++) {
      var tr = trails[k];
      while (tr.length && clock - tr[0].t > TRAIL_LIFE) tr.shift();
      for (var i = 1; i < tr.length; i++) {
        var age = (clock - tr[i].t) / TRAIL_LIFE;
        ctx.strokeStyle = "rgba(" + TRAIL + "," + (0.55 * (1 - age)).toFixed(3) + ")";
        ctx.lineWidth = 1.2 + age * 4;
        ctx.beginPath();
        ctx.moveTo(tr[i - 1].x, tr[i - 1].y);
        ctx.lineTo(tr[i].x, tr[i].y);
        ctx.stroke();
      }
    }
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    clock += dt;
    ctx.clearRect(0, 0, W, H);

    if (flight) {
      flight.s += SPEED * dt;
      var p = world(flight, flight.s), angle = heading(flight, flight.s);
      if (clock >= sampleAt) {
        sampleAt = clock + SAMPLE;
        addTrail(p[0], p[1], angle, clock);
      }
      drawTrails();
      drawPlane(p[0], p[1], angle);
      if (flight.s > flight.length) {
        flight = null;
        dir = -dir;
        wait = clock + 4 + Math.random() * 4;
      }
    } else {
      drawTrails();
      if (clock >= wait) newFlight();
    }
    requestAnimationFrame(frame);
  }

  function drawStatic() {
    // Reduzierte Bewegung: ruhendes Flugzeug kurz nach dem ersten Looping
    ctx.clearRect(0, 0, W, H);
    dir = 1;
    newFlight();
    var end = flight.loops[0] + 2 * Math.PI * flight.r + 40, span = SPEED * TRAIL_LIFE;
    clock = TRAIL_LIFE;
    trails = [[], []];
    for (var s = Math.max(0, end - span); s <= end; s += 3) {
      var p = world(flight, s);
      addTrail(p[0], p[1], heading(flight, s), (s - (end - span)) / SPEED);
    }
    drawTrails();
    var e = world(flight, end);
    drawPlane(e[0], e[1], heading(flight, end));
  }

  resize();
  if (reduce) {
    drawStatic();
    window.addEventListener("resize", function () { resize(); drawStatic(); });
  } else {
    window.addEventListener("resize", function () { resize(); flight = null; trails = [[], []]; wait = clock + 1; });
    last = performance.now();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
